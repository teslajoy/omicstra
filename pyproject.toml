[project]
name = "omicstra"
version = "0.0.1"
description = "multi-agent MCP server for cross-modal reasoning in spatial biology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
agents = ["langgraph>=0.2", "langchain-anthropic>=0.2", "anthropic>=0.40"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omicstra"]