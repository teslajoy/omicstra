[project]
name = "omicstra"
version = "0.1.0"
description = "multi-agent MCP server for cross-modal reasoning in spatial biology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "click>=8",
]

[project.scripts]
omicstra = "omicstra.cli:main"

[project.optional-dependencies]
# the read path. stays free of numpy and tensor libraries so a self-contained
# bundle can ship without them - see mcp_plan.md section 12.
mcp = ["mcp>=2"]

# computing EDA steps on real measurements
eda = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "anndata>=0.10", "pandas>=2"]

# orchestration
# langgraph-checkpoint-sqlite is not optional within this extra: the admissibility
# gate is an interrupt, and resuming it after the process exits needs a durable
# saver. OMICSTRA_CHECKPOINT=sqlite:<path> is a documented value, so the module
# behind it ships rather than failing at the moment someone relies on it.
agents = [
  "langgraph>=1",
  "langgraph-checkpoint-sqlite>=2",
  "langchain-anthropic>=0.2",
  "anthropic>=0.40",
]

dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omicstra"]

# an ALLOWLIST, not exclusions. hatchling ships everything not gitignored by
# default, which meant the sdist carried a whole virtualenv, the notebooks, the
# cohort projects and 74 MB of demo video - 192 MB for a server that is a few
# hundred KB of python and three json contracts. an end user installs the mcp
# server and nothing else. exclusions rot; an allowlist cannot.
[tool.hatch.build.targets.sdist]
only-include = [
  "src/omicstra",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "server.json",
]