[project]
name = "omicstra"
version = "1.0.0"
description = "multi-agent MCP server for cross-modal embedding alignment and evidence-based routing in spatial biology"
readme = "README.md"
# 3.11, not 3.10: tomllib is stdlib only from 3.11 and the suite already imports
# it. the floor is whatever the verify matrix actually runs, never a guess - an
# untested claim here is the same defect as a documented env var whose package
# was never declared.
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [{ name = "Nasim Sanati", email = "nasim@plenary.org" }]
keywords = ["mcp", "spatial-transcriptomics", "histopathology", "bioinformatics",
            "multimodal", "model-context-protocol"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# a dependency that an unconditional module-level import needs is a core
# dependency, not an extra. mcp is imported by mcp/server.py, langgraph by
# graph.py and graphs/*, langchain-core by protocols/__init__.py, and
# langgraph-checkpoint-sqlite backs the documented OMICSTRA_CHECKPOINT=sqlite:
# value. shipping any of them as an extra means `pip install omicstra` installs a
# server that cannot import itself, which is exactly what verify caught.
#
# NOT here, deliberately: anthropic, langchain-anthropic, pydantic-ai. the server
# holds no model and makes no outbound call - a client supplies the model, so
# nothing in src/ imports one. declaring them would put the model back inside the
# server, which is the one thing the design says not to do.
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "click>=8",
  "mcp>=2",
  "langgraph>=1",
  "langgraph-checkpoint-sqlite>=2",
  "langchain-core>=0.3",
]

[project.urls]
Repository = "https://github.com/teslajoy/omicstra"
Documentation = "https://teslajoy.github.io/omicstra/"
DOI = "https://doi.org/10.5281/zenodo.22666752"
Funding = "https://doi.org/10.55277/researchhub.6ou1w3h3"

[project.scripts]
omicstra = "omicstra.cli:main"

[project.optional-dependencies]
# the numerics, and the only genuinely optional half. named `measure` rather than
# `eda` because inventory needs it too and inventory is not eda: these are what
# the measuring steps import, wherever they run. without them the server still
# installs, imports, serves its tools, and routes on a published evidence pack.
measure = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "anndata>=0.10", "pandas>=2"]

# extracting embeddings, which is the ONLY thing that needs a tensor library.
# deliberately its own extra and deliberately not core: `pip install omicstra`
# must keep serving, routing and gating without torch, and the verify job's
# bare-install step is what stops these drifting inward.
encode = ["torch>=2.2", "timm>=1.0", "novae>=1.0", "scanpy>=1.10"]

dev = ["pytest", "ruff", "build"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omicstra"]

# an ALLOWLIST, not exclusions. hatchling ships everything not gitignored by
# default, which meant the sdist carried a whole virtualenv, the notebooks, the
# cohort projects and 74 MB of demo video - 192 MB for a server that is a few
# hundred KB of python and three json contracts. an end user installs the mcp
# server and nothing else. exclusions rot; an allowlist cannot.
[tool.hatch.build.targets.sdist]
only-include = [
  "src/omicstra",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "server.json",
]