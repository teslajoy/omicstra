[project]
name = "omicstra"
version = "0.1.0"
description = "multi-agent MCP server for cross-modal reasoning in spatial biology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "click>=8",
]

[project.scripts]
omicstra = "omicstra.cli:main"

[project.optional-dependencies]
# the read path. stays free of numpy and tensor libraries so a self-contained
# bundle can ship without them - see mcp_plan.md section 12.
mcp = ["mcp>=2"]

# computing EDA steps on real measurements
eda = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "anndata>=0.10", "pandas>=2"]

# orchestration
agents = ["langgraph>=1", "langchain-anthropic>=0.2", "anthropic>=0.40"]

dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omicstra"]